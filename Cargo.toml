[workspace]
members = [
    "crates/rover_fuzzy",
    "crates/rover_theme",
    "crates/rover_picker",
    "crates/rover_commands",
    "crates/rover_extensions",
    "crates/rover_extension_api",
    "crates/rover_plugin_api",
    "crates/rover_plugins",
    "crates/rover_db",
    "crates/rover_browser",
    "crates/rover_semantic",
    "crates/rusty_foundationmodels",

]
resolver = "2"

[workspace.dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"
dirs = "6"
toml = "0.8"
wasmtime = "29"
libloading = "0.8"
fuzzy-matcher = "0.3"
unicode-segmentation = "1"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
rusty_foundationmodels = { path = "crates/rusty_foundationmodels" }

rover_fuzzy = { path = "crates/rover_fuzzy" }
rover_theme = { path = "crates/rover_theme" }
rover_picker = { path = "crates/rover_picker" }
rover_commands = { path = "crates/rover_commands" }
rover_extensions = { path = "crates/rover_extensions" }
rover_extension_api = { path = "crates/rover_extension_api" }
rover_plugin_api = { path = "crates/rover_plugin_api" }
rover_plugins = { path = "crates/rover_plugins" }
rover_db = { path = "crates/rover_db" }
rover_browser = { path = "crates/rover_browser" }
rover_semantic = { path = "crates/rover_semantic" }

[package]
name = "rover"
version = "0.1.0"
edition = "2021"

[features]
default = ["calculator", "app-launcher", "clipboard", "file-search", "ai", "terminal", "browser", "tile", "editor"]
calculator = ["rover_plugins/calculator"]
app-launcher = ["rover_plugins/app-launcher"]
clipboard = ["rover_plugins/clipboard"]
file-search = ["rover_plugins/file-search"]
ai = ["rover_plugins/ai", "dep:rusty_foundationmodels"]
terminal = ["rover_plugins/terminal"]
browser = ["rover_plugins/browser", "dep:rover_browser"]
tile = ["rover_plugins/tile"]
editor = ["rover_plugins/editor"]

[dependencies]
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
dirs.workspace = true
urlencoding = "2"
rover_fuzzy.workspace = true
rover_theme.workspace = true
rover_picker.workspace = true
rover_extensions.workspace = true
rover_plugin_api.workspace = true
rover_plugins.workspace = true
rover_commands.workspace = true
rover_db.workspace = true
rusty_foundationmodels = { workspace = true, optional = true }
rover_browser = { workspace = true, optional = true }
rover_semantic.workspace = true


[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"
