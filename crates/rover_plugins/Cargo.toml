[package]
name = "rover_plugins"
version = "0.1.0"
edition = "2021"
description = "Plugin registry and built-in plugins for Rover launcher"

[features]
default = ["calculator", "app-launcher", "clipboard", "file-search", "ai", "terminal", "browser"]
calculator = []
app-launcher = []
clipboard = []
file-search = []
ai = []
terminal = []
browser = []
tile = ["dep:tile_core", "dep:tile_ax"]

[dependencies]
rover_plugin_api = { path = "../rover_plugin_api" }
rover_fuzzy.workspace = true
rover_commands.workspace = true
rover_db.workspace = true
rover_semantic.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
dirs.workspace = true
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tile_core = { path = "../tile_core", optional = true }
tile_ax = { path = "../tile_ax", optional = true }
