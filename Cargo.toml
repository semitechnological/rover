# Rover — SwiftUI branch
#
# This branch uses a native SwiftUI frontend (RoverSwiftUI/) linked to a single
# Rust dylib (crates/rover_swift). GPUI and all GPUI-dependent crates are not
# included here.
#
# Workspace members:
#   rover_db       — SQLite storage (clipboard, settings, browser history)
#   rover_fuzzy    — rayon-parallel skim fuzzy scorer
#   rover_semantic — fastembed vector search (AllMiniLML6V2)
#   rover_swift    — unified FFI crate that Swift links to (the only dylib)
#
# Apple Intelligence: provided by rs_ai_local (foundationmodels feature) from
# the rs_ai workspace at /Users/undivisible/projects/rs_ai.

[workspace]
members = [
    "crates/rover_db",
    "crates/rover_fuzzy",
    "crates/rover_semantic",
    "crates/rover_swift",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "2"
log         = "0.4"
dirs        = "5"
aes-gcm     = "0.10"
rand        = "0.8"
sha2        = "0.10"
base64      = "0.22"
fuzzy-matcher = "0.3"
rayon       = "1"

rover_db       = { path = "crates/rover_db" }
rover_fuzzy    = { path = "crates/rover_fuzzy" }
rover_semantic = { path = "crates/rover_semantic" }
tile_ax        = { path = "crates/tile_ax" }
tile_core      = { path = "crates/tile_core" }
rs_ai_local    = { path = "/Users/undivisible/projects/rs_ai/crates/rs_ai_local", features = ["foundationmodels"] }
