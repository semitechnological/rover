[package]
name = "rover_plugins"
version = "0.1.0"
edition = "2021"
description = "Plugin registry and built-in plugins for Rover launcher"

[features]
default = ["calculator", "app-launcher", "clipboard", "file-search", "ai", "terminal", "browser", "tile", "editor", "search-engine", "quit", "help"]
calculator = []
app-launcher = []
clipboard = []
file-search = []
ai = []
terminal = []
browser = []
tile = []
editor = []
search-engine = []
quit = []
help = []

[dependencies]
rover_plugin_api = { path = "../rover_plugin_api" }
rover_fuzzy.workspace = true
rover_commands.workspace = true
rover_db.workspace = true
rover_browser = { path = "../rover_browser" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
dirs.workspace = true
anyhow.workspace = true
toml.workspace = true
urlencoding = "2"
