[package]
name    = "rover_swift"
version = "0.1.0"
edition = "2021"
description = "Unified Rust backend for the Rover SwiftUI frontend. Single dylib Swift links to."

[lib]
name       = "rover_swift"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Internal workspace crates
rover_db               = { workspace = true }
rover_fuzzy            = { workspace = true }
rover_semantic         = { workspace = true }
rs_ai_local            = { workspace = true }

# UniFFI / eqswift code generation
eqswift  = { path = "../../../../../../eqswift/eq-swift" }
uniffi   = { version = "0.31", features = ["cli"] }

# Utilities
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
log        = { workspace = true }
dirs       = { workspace = true }
